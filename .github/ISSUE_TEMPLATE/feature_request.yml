name: Feature request
description: Suggest a change or addition.
title: '[feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is missing, broken by design, or harder than it should be.
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
      description: 'What the change would look like: which setting, prompt file, command or code area it would touch.'
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you prefer the one above.

  - type: dropdown
    id: willing-to-implement
    attributes:
      label: Would you implement this?
      options:
        - 'Yes, I can open a pull request'
        - 'Maybe, with guidance'
        - 'No'

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues for a similar request.
          required: true
        - label: "I understand the engine stays character-neutral; behaviour of one character belongs in that deployment's `prompts.local/`."
          required: true

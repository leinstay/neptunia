name: Bug report
description: Something is broken or behaving unexpectedly.
title: '[bug] '
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger this.
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: 'Output of `git rev-parse --short HEAD`.'
      placeholder: 'e.g. a1b2c3d'

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: 'Output of `node -v`.'
      placeholder: 'e.g. v20.11.0'

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'e.g. Ubuntu 24.04, Windows 11'

  - type: input
    id: endpoint-model
    attributes:
      label: Endpoint and model
      placeholder: 'e.g. OpenRouter, anthropic/claude-opus-4.6'

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: "Paste relevant lines from stdout. Strip any tokens, API keys, `data/` contents, member names and dry-run output that contains the persona's messages."
      render: json

  - type: textarea
    id: config-overrides
    attributes:
      label: 'Relevant config.local.json overrides'
      description: 'Only the settings relevant to the bug. Strip tokens and API keys.'
      render: json

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues for this problem.
          required: true
        - label: I have reproduced this on the current `main` branch.
          required: true
        - label: 'This report contains no tokens, API keys, `data/` contents, member messages or names.'
          required: true

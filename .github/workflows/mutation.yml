# Mutation testing of what reached main in the last week, once a week and on demand, apart from the pull request jobs.
#
# `npm run mutation` (scripts/mutation-diff.ts) mutates the changed lines against the tests of those files. It handles at
# most 270 changed lines, largest files first, and prints the files and line counts it left out. A score under
# `thresholds.break` of scripts/config/stryker.config.json turns this run red. A run past its timeout is a failure as well,
# so an oversized week is a red run and never a silent skip. docs/development-agents.md says what to do with one.
name: Mutation

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      base:
        description: The commit to compare with; empty takes the last commit older than a week
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: npm
      - run: npm ci
      - name: Mutate the week's changed lines
        env:
          BASE: ${{ inputs.base }}
        run: |
          base="${BASE:-$(git rev-list -1 --before='7 days ago' HEAD)}"
          if [ -z "$base" ]; then echo "mutation: no commit older than a week, nothing to compare"; exit 0; fi
          TMPDIR="$RUNNER_TEMP" npm run mutation -- "$base"
